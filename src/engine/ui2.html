<title>Blackwood Lodge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: three bands on a phone. Story text on top, an illustrated room in the middle that reacts to every action, controls and dice at the bottom. Snowbound lodge palette: ink blue, torch amber, blood red. */
:root{color-scheme:dark;
  --bg:#070a12;--bg2:#0e1422;--panel:#121a2b;--line:#263148;--ink:#e8ecf5;--mute:#8d99b8;--amber:#f2b749;--red:#e03e4e;--green:#3fc98a;--blue:#6aa7ff;
  --head:"Spectral",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font-family:var(--body);color:var(--ink);cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 max(14px,env(safe-area-inset-left,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.title{padding:max(40px,env(safe-area-inset-top,0px)) 20px 10px;text-align:center}
.title h1{margin:0;font:700 40px var(--head)}
.title p{margin:8px auto 0;color:var(--mute);max-width:34ch;font-size:15px;line-height:1.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h3{margin:0 0 8px;font:600 12px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.arch{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arch button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.arch button.on{border-color:var(--amber);background:#1a2238}
.arch b{font:700 17px var(--head)}.arch small{color:var(--mute);font-size:12.5px;line-height:1.35}
.stats{display:flex;gap:6px;margin-top:4px;font:500 11px var(--mono);color:var(--amber)}
.btn{font:700 14px var(--body);padding:12px 16px;border-radius:12px;background:#ffffff12;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.amber{background:linear-gradient(#ffd27a,var(--amber));color:#2a1c00;border-color:#ffe3a6;box-shadow:0 4px 0 #8c5e0e}
.btn.red{background:linear-gradient(#ff6b78,var(--red));color:#fff;border-color:#ff9aa3;box-shadow:0 4px 0 #8a1f2a}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
/* play: full-frame POV. Scene fills the screen; a compact HUD and a glass panel hold every word, so nothing covers the room. */
#play{position:absolute;inset:0;overflow:hidden;background:#000;--ui-top:60px;--ui-bot:230px}
#play .hud,#play .panel{transition:opacity .6s}#play.intro .hud,#play.intro .panel{opacity:0;transition:none;pointer-events:none}
.view{position:absolute;inset:0;margin:0;border:0;border-radius:0;background:#000;overflow:hidden}
canvas#sc{width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;z-index:4;display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top,0px)) 12px 0}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;background:#0d1322b8;border:1px solid #ffffff1c;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;font:600 13px var(--body);box-shadow:0 4px 14px #0006}
.chip.time{font:600 14px var(--body);letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 10px}.chip.time.out{border-color:#ff6b7855;color:#ffd4d8}
.stats{display:flex;gap:5px;margin-left:auto}.hud{gap:5px}
.stat{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 8px 0 7px;border-radius:999px;background:#0d1322b8;border:1px solid #ffffff1c;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 14px #0006}
.stat b{font:600 12px var(--mono);color:#fff;min-width:14px;text-align:right}.stat svg{width:14px;height:14px;flex:0 0 auto}.stat .bar{width:18px;height:5px;border-radius:5px;background:#ffffff22;overflow:hidden}.stat .bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.stat.hp svg{color:#ff6b78}.stat.hp .bar i{background:#ff6b78}.stat.nv svg{color:#8fbcff}.stat.nv .bar i{background:#8fbcff}.stat.bt svg{color:#ffd27a}.stat.bt .bar i{background:#ffd27a}
.stat.bt{display:none}#play.dark .stat.bt{display:inline-flex}
.ic{width:34px;height:34px;flex:0 0 auto;border-radius:999px;background:#0d1322b8;border:1px solid #ffffff1c;display:grid;place-items:center;position:relative;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 4px 14px #0006;color:#fff}
.ic svg{width:17px;height:17px}.ic .n{position:absolute;top:-5px;right:-5px;background:var(--amber);color:#2a1c00;font:700 10px var(--body);border-radius:99px;padding:1px 5px;min-width:10px;text-align:center}
/* the panel: everything textual lives here, at a fixed height, so the frame never moves */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:4;height:var(--ui-bot);box-sizing:border-box;padding:12px 16px max(10px,env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;background:linear-gradient(#0d1322e6,#070a12f2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #ffffff1a;display:flex;flex-direction:column;gap:6px;box-shadow:0 -12px 40px #0008}
.where{display:flex;align-items:center;gap:8px;font:600 10.5px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#aeb8d2;height:14px}
.where .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}.where .near{color:#ff6b78;margin-left:auto;letter-spacing:.1em}
.lines{height:92px;display:flex;flex-direction:column;justify-content:flex-start;gap:3px;overflow:hidden}
.lines p{margin:0;font:400 15px var(--head);line-height:1.36;color:#f3f5fb;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;animation:fade .35s}
.lines p:not(:last-child){-webkit-line-clamp:1;font:400 12.5px var(--body);color:#8d99b8;animation:none}
.lines p.bad{color:#ffb3ba}.lines p.ev{color:#ffd98a}.lines p.dim{color:#d0d7e6}
.msg{height:16px;font:500 11.5px var(--mono);color:#8d99b8;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}.msg b.ok{color:var(--green)}.msg b.no{color:var(--red)}
.acts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px -16px 0;padding:0 16px;-webkit-overflow-scrolling:touch}.acts::-webkit-scrollbar{display:none}
.act{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;padding:7px 4px 6px;border-radius:14px;background:#ffffff0f;border:1px solid #ffffff14;color:#fff;font:600 11.5px var(--body);line-height:1;transition:background .15s,transform .1s}
.act svg{width:20px;height:20px;stroke-width:1.8}.act small{font:500 9px var(--mono);color:#8d99b8;letter-spacing:.02em}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:visible;margin:2px 0 0;padding:0}.act{width:auto;position:relative;padding:9px 4px 8px;border-radius:16px}
.act.dim{opacity:.45}.act .b{position:absolute;top:-5px;right:8px;background:var(--amber);color:#2a1c00;font:700 10px var(--body);border-radius:99px;padding:1px 6px}.act:active{transform:scale(.94);background:#ffffff1f}
.grab{width:36px;height:4px;border-radius:4px;background:#ffffff33;margin:0 auto 6px}
.sheet .sub{margin:-4px 0 4px;color:var(--mute);font-size:13px;line-height:1.4}
.opt{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:16px;background:#ffffff0a;border:1px solid #ffffff12;text-align:left;width:100%}
.opt .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#ffffff10;color:#fff}.opt .ic svg{width:20px;height:20px}
.opt b{display:block;font:600 15px var(--body)}.opt small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:2px}
.opt .cost{font:500 11px var(--mono);color:var(--mute);text-align:right;line-height:1.4;white-space:nowrap}.opt .cost em{font-style:normal;color:var(--amber)}
.opt.dim{opacity:.45}.opt.danger{border-color:#e03e4e66;background:#e03e4e14}.opt.danger .ic{background:#e03e4e22;color:#ff8a94}
.person{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;margin-bottom:4px}.person svg{border-radius:50%;background:#fff}.person b{font:600 16px var(--body)}.person small{display:block;color:var(--mute);font-size:12.5px}
.tag{display:inline-block;font:600 10px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#ffffff14;color:#cfd6ea;margin-top:4px}
.btn.ghost{background:none;color:var(--mute);border-color:#ffffff18}
@keyframes fade{from{opacity:0;transform:translateY(3px)}}
.hots{position:absolute;inset:0;pointer-events:none;z-index:3}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:auto;padding:0;background:none;border:0;opacity:0;transition:opacity .3s}
.hot.on{opacity:1}.hot i{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 5px #ffffff2e,0 0 14px #000;display:block;animation:hpulse 1.8s infinite}
.hot span{font:600 10.5px var(--body);background:#0d1322d0;border:1px solid #ffffff22;padding:3px 8px;border-radius:999px;color:#fff;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hot.done i{border-color:#8d99b8;animation:none;box-shadow:0 0 0 4px #8d99b81f,0 0 10px #000;opacity:.7}.hot.done span{color:#8d99b8}
.hot.ev i{border-color:var(--amber);box-shadow:0 0 0 5px #f2b7492e,0 0 14px #000;animation:none}.hot.ev span{color:#ffd27a}
.hot.who i{border-color:#8fbcff}.hot.body i{border-color:#ff8a94}
@keyframes hpulse{50%{box-shadow:0 0 0 9px #ffffff14,0 0 14px #000}}
.speech{position:absolute;max-width:62%;background:#ffffffee;color:#1a1410;border-radius:16px 16px 16px 4px;padding:9px 12px;font:400 13.5px var(--head);line-height:1.4;box-shadow:0 10px 30px #0008;animation:popin .25s;transform:translate(-14%,-100%);z-index:3;backdrop-filter:blur(8px)}
.speech::after{content:"";position:absolute;left:12px;bottom:-8px;border:8px solid transparent;border-top-color:#ffffffee;border-bottom:0}
.speech b{display:block;font:600 10px var(--body);letter-spacing:.14em;text-transform:uppercase;color:#7a5a2a;margin-bottom:2px}
@keyframes popin{from{transform:translate(-14%,-100%) scale(.85);opacity:0}}
.flash{position:absolute;inset:0;background:#e03e4e;opacity:0;pointer-events:none;animation:flash .5s;z-index:3}
@keyframes flash{20%{opacity:.55}100%{opacity:0}}
.view.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.roller{position:absolute;left:0;right:0;top:var(--ui-top);bottom:var(--ui-bot);z-index:6;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 50%,#000c,#0008 60%,#0005);animation:fade .25s}
.roller.out{animation:rout .25s forwards}@keyframes rout{to{opacity:0}}
.rwrap{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.rlabel{display:flex;flex-direction:column;gap:3px}.rlabel b{font:600 20px var(--body);text-shadow:0 2px 8px #000}.rlabel span{font:500 11.5px var(--mono);color:var(--amber);letter-spacing:.06em}.rlabel .step{font:600 10px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.dbtn{width:170px;height:170px;padding:0;display:grid;place-items:center;transition:transform .15s}.die3d{width:170px;height:170px;display:block}
.dbtn:active{transform:scale(.95)}.dbtn.thrown{cursor:default}.dbtn.land{animation:land .3s cubic-bezier(.3,1.6,.5,1)}@keyframes land{0%{transform:scale(.92)}100%{transform:scale(1)}}
.dbtn.land.ok{filter:drop-shadow(0 0 18px #3fc98a88)}.dbtn.land.no{filter:drop-shadow(0 0 18px #e03e4e88)}.dbtn.crit{filter:drop-shadow(0 0 22px #f2b749)}
.rtap{font:600 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);min-height:16px;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.35}}
.rres{min-height:58px;display:flex;flex-direction:column;align-items:center;gap:4px}.rres .math{font:500 13px var(--mono);color:#cfd6ea}.rres .math b{color:#fff;font-size:16px}
.stamp{font:800 20px var(--body);letter-spacing:.16em;padding:3px 12px;border:3px solid currentColor;border-radius:8px;transform:rotate(-6deg);animation:stamp .25s cubic-bezier(.3,1.6,.5,1)}.stamp.ok{color:var(--green)}.stamp.no{color:var(--red)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}}
/* title */
#title{position:absolute;inset:0;background:#05070f;overflow:hidden}
#title canvas{position:absolute;inset:0;width:100%;height:100%}
.tover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px max(56px,env(safe-area-inset-bottom,0px));text-align:center;background:linear-gradient(transparent 45%,#05070fcc 75%,#05070f)}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px}
.logo svg.mark{width:74px;height:74px;filter:drop-shadow(0 6px 20px #000c)}
.wordmark{font:500 34px var(--head);letter-spacing:.26em;text-transform:uppercase;color:#f3f5fb;line-height:1;text-shadow:0 2px 20px #000}
.wordmark small{display:block;font:500 11px var(--body);letter-spacing:.42em;text-transform:uppercase;color:var(--amber);margin-top:10px}
.tapstart{margin-top:38px;font:600 12px var(--body);letter-spacing:.28em;text-transform:uppercase;color:#aeb8d2;animation:blink 2s infinite}
.tover.go{animation:tout .6s forwards}@keyframes tout{to{opacity:0}}
.season .logo{margin-bottom:6px}.season .logo svg.mark{width:44px;height:44px}
/* season */
.kicker{display:block;font:600 10.5px var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
.season .title{padding-top:max(28px,env(safe-area-inset-top,0px))}.season .title h1{font-size:36px;margin-top:4px}
.prog{height:4px;border-radius:4px;background:#ffffff14;margin:12px auto 0;max-width:220px;overflow:hidden}.prog i{display:block;height:100%;background:var(--amber);transition:width .6s}
.eplist{display:flex;flex-direction:column;gap:8px}
.ep{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 12px;position:relative;overflow:hidden}
.ep::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.ep.open::before{background:var(--amber)}.ep.solved::before{background:var(--green)}
.ep.locked{opacity:.45}.ep.locked .epn{background:#ffffff08;color:var(--mute)}
.epn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 17px var(--head);background:#2a2238;color:var(--amber);border:1px solid #3a3050}.epn svg{width:18px;height:18px}
.ep.solved .epn{background:#12301f;color:var(--green);border-color:#1f4a30}
.ep b{font:700 16px var(--head);display:block}.ep small{display:block;color:var(--mute);font-size:12.5px;line-height:1.35;margin-top:2px}
.ep .stars{display:flex;align-items:center;gap:3px;margin-top:5px;font-size:12px}.ep .stars em{font:500 10.5px var(--mono);color:var(--mute);margin-left:6px;font-style:normal}.ep .stars em.new{color:var(--amber)}
.ep.free .epn{background:#1a2238;color:var(--blue)}
.sheet .cold{margin:0 0 4px;font:italic 400 15px var(--head);line-height:1.5;color:#dfe4f2}.epcard .cold{margin:0;font:italic 500 15px var(--head);line-height:1.5;color:#dfe4f2}.epcard .prev{margin:0;font-size:13px;line-height:1.5;color:var(--mute);border-left:3px solid var(--line);padding-left:10px}.epcard .prev b{color:var(--ink)}
.tcard{position:absolute;inset:0;z-index:60;pointer-events:auto;cursor:default;display:grid;place-items:center;animation:tcard 2.8s forwards}
.tcard .bar{position:absolute;left:0;right:0;height:14%;background:#000}.tcard .top{top:0}.tcard .bot{bottom:0}
.tc{text-align:center;background:linear-gradient(transparent,#000c 25%,#000c 75%,transparent);padding:22px 30px;width:100%}
.tc small{display:block;font:600 11px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--amber)}.tc h2{margin:6px 0 4px;font:700 34px var(--head);letter-spacing:.01em}.tc em{font:italic 500 14px var(--head);color:#cfd6ea}
@keyframes tcard{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
.end .kicker{margin-bottom:-6px}.truth.arc{border-color:#5a4418;background:#1a1608}.truth.next{border-color:#1f3a5a;background:#0c1626}
/* sheets */
.scrim{position:absolute;inset:0;background:#000a;z-index:19}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:20;animation:up .25s}
@keyframes up{from{transform:translateY(40px)}}
.sheet h2{margin:0;font:700 22px var(--head)}
.map{position:relative;height:230px;border-radius:14px;background:#0b1020;border:1px solid var(--line);overflow:hidden}
.map svg{width:100%;height:100%}
.room rect{fill:#141c30;stroke:#2a3650;stroke-width:1.2;rx:4}.room text{font:600 5.6px var(--body);fill:#8d99b8;text-anchor:middle;pointer-events:none}
.room.here rect{fill:#3a2d10;stroke:var(--amber);stroke-width:1.6}.room.here text{fill:#ffe3a6}
.room.adj{cursor:pointer}.room.adj rect{stroke:#6aa7ff;stroke-dasharray:3 2;fill:#16213c}.room.adj text{fill:#cfe0ff}
.room.unknown rect{fill:#0e1322;stroke:#1b2438}.room.unknown text{fill:#3d4866}
.room.danger rect{stroke:var(--red);stroke-width:1.8}
.npcdot{fill:var(--amber);stroke:#000;stroke-width:.6}
.people{display:flex;flex-direction:column;gap:6px}.people button{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;text-align:left;background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.people svg{border-radius:50%;background:#fff}.people b{font:700 15px var(--head);display:block}.people small{color:var(--mute);font-size:12px}
.doors{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.doors button{background:#16213c;border:1px solid #6aa7ff66;border-radius:12px;padding:10px;font:600 13px var(--body);text-align:left}
.sus{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:10px}
.sus svg{width:48px;height:48px;border-radius:50%;background:#fff}
.sus b{font:700 15px var(--head)}.sus small{display:block;color:var(--mute);font-size:12px}
.sus .st{margin-top:4px;font-size:13px;line-height:1.4}.sus .st i{color:#ffd27a;font-style:normal}
.evl{display:flex;flex-direction:column;gap:6px}.evl div{background:#ffffff08;border-left:3px solid var(--amber);border-radius:8px;padding:8px 10px;font-size:13.5px;line-height:1.4}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.pick button{background:#ffffff0c;border:2px solid var(--line);border-radius:12px;padding:10px;font:600 13px var(--body);text-align:left}.pick button.on{border-color:var(--red)}
.journal p{margin:0 0 6px;font:500 14px var(--head);line-height:1.45}.journal time{font:500 10px var(--mono);color:var(--mute);margin-right:6px}
.end{position:absolute;inset:0;z-index:40;background:radial-gradient(90% 60% at 50% 20%,#1a2238,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px;text-align:center;animation:fade .5s}
.end h2{margin:0;font:700 34px var(--head)}.end p{margin:0;color:#cfd6ea;max-width:34ch;line-height:1.55;font-size:15px}
.end .big{display:flex;gap:10px;font-size:40px}
.star{display:inline-block;width:1em;height:1em;background:currentColor;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}

  else{h2='Dawn';p='Nobody is named. The police take statements and everyone goes home, one of them smiling.';SND.no()}
  save();const next=e.n&&e.n<8?SEASON.eps[e.n]:null;
  $('#play').insertAdjacentHTML('beforeend',`<div class="end"><small class="kicker">${e.n?`Episode ${e.n} · ${e.t}`:'Free play'}</small><h2>${h2}</h2>${win?`<div class="big">${[0,1,2].map(i=>`<i class="star ${i<st?'on':'off'}"></i>`).join('')}</div>`:''}<p>${p}</p>
    <div class="truth"><b>What happened:</b> at 9:40, ${k.n} (${k.height}, ${k.coat} coat) followed ${M.victim.first} into the study and used the ${M.weapon.n}, then hid it in the ${ROOMS[M.weaponRoom].n.toLowerCase()}${M.weaponMoved?' after moving it at midnight':''}. ${short(k.n)} claimed to be with ${M.sus.find(s=>s.id===M.lone).n}, who was alone.${M.liar2?` ${M.sus.find(s=>s.id===M.liar2).n} also lied, but only about being ${M.liar2Truth}.`:''} ${M.sus.find(s=>s.id===M.witness).n} saw them go in.</div>
    ${win&&e.arc?`<div class="truth arc"><b>From the Blackwood file:</b> ${e.arc}</div>`:''}
    ${win&&next?`<div class="truth next"><b>Next time on ${SEASON.title}:</b> ${next.logline}</div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${win&&next?`<button class="btn amber" id="nextep">Next episode</button>`:''}<button class="btn ${win?'':'amber'}" id="again">${win?'Play again · new case':'Try again · new case'}</button><button class="btn" id="home2">Season</button></div></div>`);
  $('#again').onclick=()=>startGame((Math.random()*1e9)|0,G.arch,e);$('#home2').onclick=renderHome;if($('#nextep'))$('#nextep').onclick=()=>episodeCardFromPlay(next)}
function episodeCardFromPlay(next){renderHome();episodeCard(next.n)}
window.addEventListener('resize',()=>{if(G&&!$('#play').hidden)setupCanvas()});
renderTitle();
</script>
